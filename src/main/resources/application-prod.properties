# Server
server.port=${PORT:8080}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=nexaverse-group
spring.kafka.consumer.auto-offset-reset=earliest

# Spring AI (Groq)
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama3-8b-8192

# JWT
jwt.secret=${JWT_SECRET:nexaverse_super_secret_key_2024}
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.nexaverse=DEBUG

# Swagger disable in prod (optional)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true